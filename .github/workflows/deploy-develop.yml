name: Build and Deploy Front (Teste)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: docker build -t arthenyo/frotapro-front:test .

      - name: Push image
        run: docker push arthenyo/frotapro-front:test

      - name: Deploy no ambiente de teste
        run: |
          cd /opt/apps/frotapro-test
          docker compose --env-file /opt/env/frotapro-test/.env.test pull frotapro-front
          docker compose --env-file /opt/env/frotapro-test/.env.test up -d --no-deps --remove-orphans frotapro-front
          docker compose logs --tail=100 frotapro-front
