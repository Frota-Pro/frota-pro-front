name: Build and Deploy Front

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, vps10364]

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build image
        run: docker build -t arthenyo/frotapro-front:latest .

      - name: Push image
        run: docker push arthenyo/frotapro-front:latest

      - name: Deploy locally (VM)
        run: |
          cd /opt/apps/frotapro-prod
          docker compose --env-file /opt/env/frotapro-prod/.env.prod pull frotapro-front
          docker compose --env-file /opt/env/frotapro-prod/.env.prod up -d --no-deps --remove-orphans frotapro-front
          docker compose logs --tail=100 frotapro-front
