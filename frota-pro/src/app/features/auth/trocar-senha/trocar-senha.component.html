<div class="login-container">
  <div class="login-card">

    <div class="brand">
      <img src="/assets/logo.png" alt="Logo FrotaPRO" class="logo" />
      <div class="brand-text">
        <h1>FrotaPRO</h1>
        <p>Gestão de frota e logística</p>
      </div>
    </div>

    <div class="divider"></div>

    <h2>Troque sua senha</h2>
    <p class="subtitle">Por segurança, você precisa definir uma senha nova antes de continuar.</p>

    <form (ngSubmit)="salvar()" autocomplete="on">

      <div class="form-group">
        <label for="senhaAtual">Senha atual</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">🔒</span>
          <input
            id="senhaAtual"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="senhaAtual"
            name="senhaAtual"
            required
            placeholder="Digite sua senha atual"
            autocomplete="current-password"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="novaSenha">Nova senha</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">🔑</span>
          <input
            id="novaSenha"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="novaSenha"
            name="novaSenha"
            required
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarNovaSenha">Confirmar nova senha</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">🔑</span>
          <input
            id="confirmarNovaSenha"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="confirmarNovaSenha"
            name="confirmarNovaSenha"
            required
            placeholder="Repita a nova senha"
            autocomplete="new-password"
          />

          <button
            type="button"
            class="eye"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword ? 'Ocultar senhas' : 'Mostrar senhas'"
          >
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="login-button" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        {{ loading ? 'Salvando...' : 'Salvar nova senha' }}
      </button>

      <div class="hint">
        <span class="dot"></span>
        Não use a senha padrão nem a mesma senha de antes.
      </div>
    </form>

    <button type="button" class="link-sair" (click)="sair()">Sair</button>

  </div>
</div>
